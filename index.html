<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF 2026 | Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="formstyle.css?v=6">
</head>
<body>
    <header>
        <h1>CTF 2026</h1>
        <h2>REGISTRATION</h2>
        <p>With great power comes great responsibility.</p>
    </header>
    <main>
        <form id="detail-form">
            <!-- Team Details -->
            <section class="form-section">
                <h2> Team Details</h2>
                <label for="teamName">Team Name</label>
                <input
                    type="text"
                    id="teamName"
                    name="teamName"
                    placeholder="Enter team name"
                    required
                >
                <label for="leadName">Team Lead Name</label>
                <input
                    type="text"
                    id="leadName"
                    name="leadName"
                    placeholder="Enter team lead name"
                    required
                >
                <label for="leadRegNo">Team Lead Registration Number</label>
                <input
                    type="text"
                    id="leadRegNo"
                    name="leadRegNo"
                    placeholder="Enter registration number"
                    required
                >
                <label for="leadEmail">Team Lead College Mail ID</label>
                <input
                    type="email"
                    id="leadEmail"
                    name="leadEmail"
                    placeholder="Enter college mail ID"
                    required
                >
            </section>
            <!-- Member 01 -->
            <section class="form-section">
                <h2> Member 01</h2>
                <label for="member1Name">Name</label>
                <input
                    type="text"
                    id="member1Name"
                    name="member1Name"
                    placeholder="Enter name"
                    required
                >
                <label for="member1RegNo">Registration Number</label>
                <input
                    type="text"
                    id="member1RegNo"
                    name="member1RegNo"
                    placeholder="Enter registration number"
                    required
                >
                <label for="member1Email">College Mail ID</label>
                <input
                    type="email"
                    id="member1Email"
                    name="member1Email"
                    placeholder="Enter college mail ID"
                    required
                >
            </section>
            <!-- Member 02 -->
            <section class="form-section">
                <h2> Member 02</h2>
                <label for="member2Name">Name</label>
                <input
                    type="text"
                    id="member2Name"
                    name="member2Name"
                    placeholder="Enter name"
                    required
                >
                <label for="member2RegNo">Registration Number</label>
                <input
                    type="text"
                    id="member2RegNo"
                    name="member2RegNo"
                    placeholder="Enter registration number"
                    required
                >
                <label for="member2Email">College Mail ID</label>
                <input
                    type="email"
                    id="member2Email"
                    name="member2Email"
                    placeholder="Enter college mail ID"
                    required
                >
            </section>
            <!-- Member 03 -->
            <section class="form-section">
                <h2> Member 03</h2>
                <label for="member3Name">Name</label>
                <input
                    type="text"
                    id="member3Name"
                    name="member3Name"
                    placeholder="Enter name"
                    required
                >
                <label for="member3RegNo">Registration Number</label>
                <input
                    type="text"
                    id="member3RegNo"
                    name="member3RegNo"
                    placeholder="Enter registration number"
                    required
                >
                <label for="member3Email">College Mail ID</label>
                <input
                    type="email"
                    id="member3Email"
                    name="member3Email"
                    placeholder="Enter college mail ID"
                    required
                >
            </section>
            <!-- Submit -->
            <button type="submit">
                 Submit Registration
            </button>
        </form>
    </main>
    <script src="formlogic.js"></script>
</body>
</html>
